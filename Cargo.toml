[workspace]
members = ["rust/boltzpmp-core", "rust/boltzpmp-py"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["TK"]
repository = "https://github.com/Reasonia-TK/boltzpmp"

[workspace.dependencies]
boltzpmp-core = { path = "rust/boltzpmp-core" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rayon = "1.11"
thiserror = "2"
